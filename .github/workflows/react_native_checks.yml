name: React Native checks

on:
  push:
    paths:
      - 'apps/mobile-react-native/**'
      - '.github/workflows/react_native_checks.yml'
  pull_request:
    paths:
      - 'apps/mobile-react-native/**'
      - '.github/workflows/react_native_checks.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile-react-native/package-lock.json
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate development configuration
        run: npm run configure
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint -- --max-warnings=0
      - name: Jest
        run: npm test -- --silent
