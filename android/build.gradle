allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// CI/Codex can opt into a fresh build directory to avoid Windows file-locking
// conflicts from a previously interrupted Gradle process. Normal local builds
// continue to use Flutter's standard ../build directory.
def isolatedBuildDir = System.getenv('SEMITRAX_GRADLE_BUILD_DIR')
rootProject.buildDir = isolatedBuildDir ? file(isolatedBuildDir) : file('../build')
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
