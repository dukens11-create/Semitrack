name: React Native validation and Android debug build

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact React Native dependencies and vendor patch
        run: npm ci
      - name: Validate TypeScript, lint, Jest, native project and tooling
        run: npm run check
      - name: Verify CoPilot patch and native Java bridge exist
        shell: bash
        run: |
          test -f node_modules/trimble-maps-cpik-react-native-library/android/src/main/java/com/alk/cpik/react/CopilotViewManager.java
          grep -q 'isNativeCoPilotViewAvailable' node_modules/trimble-maps-cpik-react-native-library/android/src/main/java/com/alk/cpik/react/CopilotViewManager.java
          grep -q 'reportSdkReadiness' android/app/src/main/java/com/semitrax/nativebridge/SemiTraxCopilotMapReadinessModule.java

  android-debug:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
      SEMITRAX_API_URL: ${{ vars.SEMITRAX_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci
      - name: Assemble Android debug
        shell: bash
        run: |
          test -n "$SEMITRAX_API_URL" || { echo "::error::Set repository variable SEMITRAX_API_URL to the approved HTTPS backend URL"; exit 1; }
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon
      - name: Upload debug APK (not a proven navigation release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: semitrax-rn-debug-unverified
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
