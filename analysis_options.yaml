analyzer:
  # Licensed local SDKs are separate packages with their own dependency graph.
  # App imports from them remain type-checked during normal analysis.
  exclude:
    - plugins/**
    # Preserved dormant HERE adapter; excluded while the licensed plugin is
    # intentionally not part of the active Trimble routing build.
    - lib/services/here_sdk_service.dart
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
