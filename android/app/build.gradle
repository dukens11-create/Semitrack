plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'
def productionApplicationId = project.findProperty('SEMITRACK_APPLICATION_ID') ?: System.getenv('SEMITRACK_APPLICATION_ID') ?: 'com.semitrax.app'
def releaseStoreFile = project.findProperty('SEMITRACK_RELEASE_STORE_FILE') ?: System.getenv('SEMITRACK_RELEASE_STORE_FILE')
def releaseStorePassword = project.findProperty('SEMITRACK_RELEASE_STORE_PASSWORD') ?: System.getenv('SEMITRACK_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = project.findProperty('SEMITRACK_RELEASE_KEY_ALIAS') ?: System.getenv('SEMITRACK_RELEASE_KEY_ALIAS')
def releaseKeyPassword = project.findProperty('SEMITRACK_RELEASE_KEY_PASSWORD') ?: System.getenv('SEMITRACK_RELEASE_KEY_PASSWORD')
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }

if (productionApplicationId.startsWith('com.example.')) {
    throw new GradleException('SEMITRACK_APPLICATION_ID must be a production identifier and cannot use com.example.*')
}
if (releaseRequested && !(releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword)) {
    throw new GradleException(
        'Release signing is not configured. Set SEMITRACK_RELEASE_STORE_FILE, ' +
        'SEMITRACK_RELEASE_STORE_PASSWORD, SEMITRACK_RELEASE_KEY_ALIAS, and SEMITRACK_RELEASE_KEY_PASSWORD securely.'
    )
}

android {
    namespace "com.semitrax.app"
    compileSdkVersion 36
    // Use the highest NDK required by the resolved native dependencies.
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    buildFeatures { buildConfig true }
    sourceSets { main.java.srcDirs += 'src/main/kotlin' }

    defaultConfig {
        applicationId productionApplicationId
        minSdkVersion 26
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

    }

    signingConfigs {
        if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            // A release artifact is never signed with the shared debug key.
            if (signingConfigs.findByName("release") != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

flutter { source '../..' }

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "com.google.android.gms:play-services-location:21.3.0"
    testImplementation "junit:junit:4.13.2"
}
