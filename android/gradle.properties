org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# All resolved Flutter/HERE/Mapbox dependencies are already AndroidX. Avoid
# rewriting their JARs, which also prevents Windows javac ZIP locking failures.
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Keep Kotlin compilation in the Gradle process. This avoids Windows daemon
# temp-file ownership/locking failures when builds run from different users.
kotlin.compiler.execution.strategy=in-process
# Serialize Android compilation on Windows so generated plugin JARs are closed
# before dependent javac tasks open them.
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.vfs.watch=false
