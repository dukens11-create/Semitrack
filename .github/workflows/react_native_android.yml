name: React Native Android test APK

on:
  push:
    branches: ['codex/rn-android-test-apk', 'codex/copilot-embedded-setup', 'codex/copilot-module-resolution', 'codex/copilot-map-downloads', 'codex/copilot-initial-map-readiness', 'codex/finish-semitrax']
    paths:
      - 'apps/mobile-react-native/**'
      - '.github/workflows/react_native_android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile-react-native
    env:
      SEMITRAX_API_URL: https://semitrax-api.onrender.com
      MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN || secrets.MAPBOX_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile-react-native/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install dependencies and apply native vendor patch
        run: npm ci --no-audit --no-fund
      - name: Validate map configuration for the device APK
        run: |
          node --experimental-strip-types --input-type=module -e 'import { validateReleaseMapToken } from "./src/config/environment.ts"; validateReleaseMapToken(process.env.MAPBOX_PUBLIC_TOKEN || "");'
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Build standalone arm64 debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Verify packaged native libraries, alignment, and APK signature
        run: |
          semitrax_apk="android/app/build/outputs/apk/debug/app-debug.apk"
          semitrax_native_dir="$(mktemp -d)"
          unzip -q "$semitrax_apk" 'lib/*/*.so' -d "$semitrax_native_dir"
          node scripts/check-android-page-size.cjs "$semitrax_native_dir"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$semitrax_apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$semitrax_apk"
      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: SemiTraX-Android-test
          path: apps/mobile-react-native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
