pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def sdkPath = properties.getProperty("flutter.sdk")
        assert sdkPath != null, "flutter.sdk not set in local.properties"
        return sdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

def mapboxDownloadsToken = providers
    .gradleProperty("MAPBOX_DOWNLOADS_TOKEN")
    .orElse(providers.environmentVariable("MAPBOX_DOWNLOADS_TOKEN"))
    .orNull

def tomtomRepositoryUsername = providers
    .gradleProperty("repositoriesTomtomComUsername")
    .orElse(providers.environmentVariable("TOMTOM_REPOSITORY_USERNAME"))
    .orNull

def tomtomRepositoryPassword = providers
    .gradleProperty("repositoriesTomtomComPassword")
    .orElse(providers.environmentVariable("TOMTOM_REPOSITORY_PASSWORD"))
    .orNull

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://storage.googleapis.com/download.flutter.io") }
        maven {
            url = uri("https://repositories.tomtom.com/artifactory/maven")
            if (tomtomRepositoryUsername && tomtomRepositoryPassword) {
                credentials {
                    username = tomtomRepositoryUsername
                    password = tomtomRepositoryPassword
                }
            }
        }
        // HERE's licensed Flutter plugin contains a local Android AAR. The
        // plugin folder is ignored and must be installed from the HERE bundle.
        flatDir { dirs = [file("../plugins/here_sdk/android/libs")] }
        maven {
            url = uri("https://api.mapbox.com/downloads/v2/releases/maven")
            authentication { basic(BasicAuthentication) }
            credentials {
                username = "mapbox"
                // The secret downloads token belongs in the user's Gradle
                // properties or process environment, never in this repository.
                password = mapboxDownloadsToken ?: ""
            }
        }
    }
}

include ":app"
