name: React Native Android test APK

on:
  push:
    branches: ['codex/rn-android-test-apk', 'codex/copilot-embedded-setup', 'codex/copilot-module-resolution', 'codex/copilot-map-downloads', 'codex/copilot-initial-map-readiness']
    paths:
      - 'apps/mobile-react-native/**'
      - '.github/workflows/react_native_android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile-react-native
    env:
      SEMITRAX_API_URL: https://semitrax-api.onrender.com
      MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN || secrets.MAPBOX_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile-react-native/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install dependencies and apply native vendor patch
        run: npm ci --no-audit --no-fund
      - name: Report map configuration availability
        run: |
          if [ -z "$MAPBOX_PUBLIC_TOKEN" ]; then echo "::warning::No public Mapbox display token configured; this debug APK will show configuration required for maps."; fi
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Build standalone arm64 debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: SemiTraX-Android-test
          path: apps/mobile-react-native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
