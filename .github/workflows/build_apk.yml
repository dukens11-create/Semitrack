name: SemiTraX API Validation

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TRIMBLE_API_KEY: ""
      MAPBOX_ACCESS_TOKEN: ""
      MAPBOX_DOWNLOADS_TOKEN: ""
      DATABASE_URL: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        run: npm run prisma:generate

      - name: Typecheck API
        working-directory: apps/api
        run: npm run typecheck

      - name: Build API
        working-directory: apps/api
        run: npm run build

      - name: Run focused Trimble multi-stop tests
        working-directory: apps/api
        run: node --experimental-strip-types --test test/trimbleMultiLeg.test.ts

      - name: Run full API test suite
        working-directory: apps/api
        run: npm test
