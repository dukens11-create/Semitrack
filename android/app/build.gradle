plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'
def tomtomApiKey = localProperties.getProperty('tomtomApiKey') ?: ''
def productionApplicationId = project.findProperty('SEMITRACK_APPLICATION_ID')
def releaseStoreFile = project.findProperty('SEMITRACK_RELEASE_STORE_FILE')
def releaseStorePassword = project.findProperty('SEMITRACK_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = project.findProperty('SEMITRACK_RELEASE_KEY_ALIAS')
def releaseKeyPassword = project.findProperty('SEMITRACK_RELEASE_KEY_PASSWORD')

android {
    namespace "com.example.semitrack_mobile"
    compileSdkVersion 36
    // Use the highest NDK required by the resolved native dependencies. NDKs
    // are backward compatible, and HERE 4.27.2 supports 16 KB page sizes.
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    buildFeatures { buildConfig true }
    sourceSets { main.java.srcDirs += 'src/main/kotlin' }

    defaultConfig {
        applicationId productionApplicationId ?: "com.example.semitrack_mobile"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

        missingDimensionStrategy "tomtom-sdk-version", "complete"
        buildConfigField "String", "TOMTOM_API_KEY", "\"${tomtomApiKey}\""
    }

    signingConfigs {
        if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // A release artifact is never signed with the shared debug key.
            if (signingConfigs.findByName("release") != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

flutter { source '../..' }

dependencies {
    def tomtomSdkVersion = "2.5.3"

    implementation "androidx.core:core-ktx:1.13.1"
    implementation "com.google.android.gms:play-services-location:21.3.0"
    implementation "com.tomtom.sdk:init:${tomtomSdkVersion}"
    testImplementation "junit:junit:4.13.2"
}
