name: SemiTraX Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://semitrax_test:fixture-only@127.0.0.1:55432/semitrax_test_0123456789abcdef
      SUBSCRIPTION_TEST_DATABASE_URL: postgresql://semitrax_test:fixture-only@127.0.0.1:55432/semitrax_test_0123456789abcdef
      SEMITRAX_ISOLATED_DATABASE: semitrax_test_0123456789abcdef
      JWT_SECRET: fixture-only-jwt-secret-not-for-production-0123456789
      ROUTING_PROVIDER: trimble
      TRIMBLE_API_KEY: ""
      HERE_API_KEY: ""
      OPENWEATHER_API_KEY: ""
      MAPBOX_TOKEN: ""

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: semitrax_test
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: semitrax_test_0123456789abcdef
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U semitrax_test -d semitrax_test_0123456789abcdef"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/mobile-react-native/package-lock.json
            apps/admin/package-lock.json

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Validate and migrate disposable API database
        working-directory: apps/api
        run: |
          npm run prisma:generate
          npm run prisma:validate
          npm run prisma:deploy

      - name: Validate API
        working-directory: apps/api
        run: |
          npm run typecheck
          npm test

      - name: Install React Native dependencies
        working-directory: apps/mobile-react-native
        run: npm ci

      - name: Validate React Native
        working-directory: apps/mobile-react-native
        run: npm run check

      - name: Install admin dependencies
        working-directory: apps/admin
        run: npm ci

      - name: Validate admin
        working-directory: apps/admin
        run: |
          npm run typecheck
          npm run build
